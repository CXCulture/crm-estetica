<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Operação GL | CRM & Gestão Estética Avançada</title>
  
  <!-- Tipografia Inter & Tailwind CSS via CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>

  <!-- Lucide Icons & Alpine.js (Motor Reativo sem necessidade de Build) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- Supabase Client JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #090d16; color: #f8fafc; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body x-data="crmApp()" x-init="initApp()" class="min-h-screen bg-[#090d16] text-slate-100 flex flex-col items-center">

  <!-- TOPBAR DE NAVEGAÇÃO -->
  <header class="w-full bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 p-3 flex items-center justify-between sticky top-0 z-40">
    <div className="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse" title="Base de Dados Ativa"></span>
      <span class="font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-purple-400 to-indigo-400 text-base">
        Operação GL
      </span>
      <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md font-mono border border-slate-700">CRM v2.0</span>
    </div>

    <!-- SELETOR DE VISÃO (MOBILE VS DESKTOP WIDESCREEN) -->
    <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
      <button 
        @click="devicePreview = 'mobile'" 
        :class="devicePreview === 'mobile' ? 'bg-rose-500 text-white shadow-lg' : 'text-slate-400 hover:text-white'" 
        class="p-1.5 rounded-lg transition-all flex items-center gap-1 text-xs font-medium"
        title="Visão Telemóvel"
      >
        <i data-lucide="smartphone" class="w-4 h-4"></i>
      </button>
      <button 
        @click="devicePreview = 'desktop'" 
        :class="devicePreview === 'desktop' ? 'bg-rose-500 text-white shadow-lg' : 'text-slate-400 hover:text-white'" 
        class="p-1.5 rounded-lg transition-all flex items-center gap-1 text-xs font-medium"
        title="Visão Desktop Widescreen"
      >
        <i data-lucide="monitor" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- PAINEL PRINCIPAL -->
  <main 
    :class="devicePreview === 'mobile' 
      ? 'max-w-md my-0 sm:my-4 border-0 sm:border border-slate-800 rounded-none sm:rounded-3xl shadow-2xl overflow-hidden' 
      : 'max-w-5xl p-6 my-4 border border-slate-800/60 rounded-3xl shadow-2xl'"
    class="w-full transition-all duration-300 bg-slate-900/60"
  >
    <!-- DASHBOARD DE MÉTRICAS RÁPIDAS -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 p-3 bg-slate-950/80 border-b border-slate-800/80 text-xs">
      <div class="p-2.5 bg-slate-900/80 border border-slate-800 rounded-xl">
        <span class="text-slate-400 block text-[10px]">Atendimentos Hoje</span>
        <strong class="text-white text-sm font-bold" x-text="appointments.length"></strong>
      </div>
      <div class="p-2.5 bg-slate-900/80 border border-slate-800 rounded-xl">
        <span class="text-slate-400 block text-[10px]">Faturamento Previsto</span>
        <strong class="text-emerald-400 text-sm font-bold" x-text="'€ ' + calculateRevenue()"></strong>
      </div>
      <div class="p-2.5 bg-slate-900/80 border border-slate-800 rounded-xl">
        <span class="text-slate-400 block text-[10px]">Laser vs Facial</span>
        <strong class="text-rose-400 text-sm font-bold" x-text="countLaser() + ' L / ' + countFacial() + ' F'"></strong>
      </div>
      <div class="p-2.5 bg-slate-900/80 border border-slate-800 rounded-xl">
        <span class="text-slate-400 block text-[10px]">Alertas Clínicos</span>
        <strong class="text-amber-400 text-sm font-bold" x-text="countAlerts()"></strong>
      </div>
    </div>

    <!-- STORIES BAR (ATENDIMENTOS DO DIA ESTILO INSTAGRAM) -->
    <div class="w-full bg-slate-900/90 border-b border-slate-800 p-3 overflow-x-auto no-scrollbar flex items-center gap-4">
      <button @click="selectedStoryId = null" class="flex flex-col items-center gap-1 shrink-0 focus:outline-none">
        <div :class="selectedStoryId === null ? 'border-rose-500 ring-2 ring-rose-500/40' : 'border-slate-700'" class="p-0.5 rounded-full border-2 transition-all">
          <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center text-rose-400">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
          </div>
        </div>
        <span class="text-[10px] font-medium text-slate-300">Todas</span>
      </button>

      <template x-for="item in appointments" :key="item.id">
        <button @click="selectedStoryId = (selectedStoryId === item.id ? null : item.id)" class="flex flex-col items-center gap-1 shrink-0 focus:outline-none">
          <div :class="[getStatusBorder(item.status), selectedStoryId === item.id ? 'scale-110 ring-2 ring-rose-500' : '']" class="p-0.5 rounded-full border-2 transition-all relative">
            <img :src="item.clientAvatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(item.clientName)" class="w-12 h-12 rounded-full bg-slate-800 object-cover" />
            <template x-if="item.status === 'alerta_clinico'">
              <span class="absolute -top-1 -right-1 bg-amber-500 text-slate-950 p-0.5 rounded-full shadow-lg">
                <i data-lucide="alert-circle" class="w-3 h-3"></i>
              </span>
            </template>
          </div>
          <span class="text-[10px] font-medium text-slate-300 max-w-[64px] truncate" x-text="item.clientName.split(' ')"></span>
          <span class="text-[9px] font-mono text-slate-500" x-text="item.time"></span>
        </button>
      </template>
    </div>

    <!-- TABS DE NAVEGAÇÃO: FEED VS CALENDÁRIO -->
    <div class="p-3 flex gap-2 bg-slate-900/50 border-b border-slate-800">
      <button 
        @click="viewMode = 'feed'" 
        :class="viewMode === 'feed' ? 'bg-rose-600 text-white shadow-lg shadow-rose-900/30' : 'bg-slate-800/60 text-slate-400 hover:text-white'" 
        class="flex-1 py-2 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 transition-all"
      >
        <i data-lucide="layout-grid" class="w-4 h-4"></i> Feed Cronológico
      </button>
      <button 
        @click="viewMode = 'calendar'" 
        :class="viewMode === 'calendar' ? 'bg-rose-600 text-white shadow-lg shadow-rose-900/30' : 'bg-slate-800/60 text-slate-400 hover:text-white'" 
        class="flex-1 py-2 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 transition-all"
      >
        <i data-lucide="calendar" class="w-4 h-4"></i> Grade de Horários
      </button>
    </div>

    <!-- CONTEÚDO PRINCIPAL (FEED DE SESSÕES) -->
    <div class="p-4 bg-slate-950 min-h-[480px]">
      <template x-if="viewMode === 'feed'">
        <div>
          <template x-for="app in filteredAppointments" :key="app.id">
            <article class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 mb-4 shadow-xl hover:border-slate-700 transition-all">
              <!-- Topo do Card -->
              <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-3">
                  <img :src="app.clientAvatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(app.clientName)" class="w-10 h-10 rounded-full bg-slate-800" />
                  <div>
                    <h3 class="font-bold text-white text-sm" x-text="app.clientName"></h3>
                    <p class="text-xs text-rose-400 font-medium" x-text="app.serviceName"></p>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-mono font-bold text-slate-300 bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full flex items-center gap-1">
                    <i data-lucide="clock" class="w-3 h-3 text-rose-400"></i>
                    <span x-text="app.time"></span>
                  </span>
                </div>
              </div>

              <!-- Ficha de Anamnese & Fitzpatrick -->
              <div class="bg-slate-950/70 p-3 rounded-xl border border-slate-800/80 text-xs space-y-2 mb-3">
                <div class="flex justify-between items-center">
                  <span class="text-slate-400 flex items-center gap-1">
                    <i data-lucide="user-check" class="w-3.5 h-3.5 text-purple-400"></i> Fototipo Fitzpatrick:
                  </span>
                  <span class="px-2 py-0.5 bg-purple-500/20 text-purple-300 rounded font-bold border border-purple-500/30" x-text="'Tipo ' + app.anamnesis.fitzpatrick"></span>
                </div>

                <template x-if="app.anamnesis.usesPhotosensitiveAcids">
                  <div class="flex items-center gap-1.5 text-amber-400 bg-amber-500/10 p-2 rounded-lg border border-amber-500/20 font-semibold text-[11px]">
                    <i data-lucide="shield-alert" class="w-4 h-4 shrink-0"></i>
                    <span>Atenção: Uso de Medicamentos / Ácidos Fotossensibilizantes</span>
                  </div>
                </template>
              </div>

              <!-- Parâmetros do Equipamento Laser -->
              <template x-if="app.laserParams">
                <div class="bg-slate-950/90 p-3 rounded-xl border border-slate-800 text-xs mb-3 space-y-2">
                  <div class="flex items-center justify-between text-rose-400 font-bold">
                    <span class="flex items-center gap-1 uppercase tracking-wider text-[10px]">
                      <i data-lucide="zap" class="w-3.5 h-3.5"></i> Parâmetros Técnicos do Laser
                    </span>
                    <span class="text-[10px] text-slate-500 font-mono" x-text="app.laserParams.fluenceJcm2 + ' J/cm²'"></span>
                  </div>
                  <div class="grid grid-cols-2 gap-2 text-slate-300">
                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 flex justify-between">
                      <span class="text-slate-400">Fluência:</span>
                      <strong class="text-white font-mono" x-text="app.laserParams.fluenceJcm2 + ' J/cm²'"></strong>
                    </div>
                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 flex justify-between">
                      <span class="text-slate-400">Pulso:</span>
                      <strong class="text-white font-mono" x-text="app.laserParams.pulseMs + ' ms'"></strong>
                    </div>
                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 flex justify-between">
                      <span class="text-slate-400">Disparos:</span>
                      <strong class="text-white font-mono" x-text="app.laserParams.totalShots"></strong>
                    </div>
                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 flex justify-between">
                      <span class="text-slate-400">Spot Size:</span>
                      <strong class="text-white font-mono" x-text="app.laserParams.spotSizeMm + ' mm'"></strong>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Ações no Card -->
              <div class="flex justify-between items-center pt-2 border-t border-slate-800/80">
                <button @click="openEditModal(app)" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                  <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Editar Ficha
                </button>
                <button 
                  @click="toggleStatus(app)" 
                  :class="app.status === 'concluido' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-emerald-600 hover:bg-emerald-500 text-white'" 
                  class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition-all"
                >
                  <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                  <span x-text="app.status === 'concluido' ? 'Sessão Concluída' : 'Concluir Atendimento'"></span>
                </button>
              </div>
            </article>
          </template>
        </div>
      </template>

      <!-- GRADE DE CALENDÁRIO INTERATIVO -->
      <template x-if="viewMode === 'calendar'">
        <div class="space-y-2">
          <p class="text-xs text-slate-400 mb-3 flex items-center gap-1">
            <i data-lucide="info" class="w-3.5 h-3.5 text-rose-400"></i> Clique em qualquer slot vago para agendar uma cliente:
          </p>
          <template x-for="slot in timeSlots" :key="slot">
            <div 
              @click="handleSlotClick(slot)" 
              :class="isSlotBooked(slot) ? 'bg-slate-800/50 border-slate-700/60 cursor-default' : 'bg-slate-950 border-slate-800 hover:border-rose-500 cursor-pointer hover:bg-slate-900/60'" 
              class="p-3 rounded-xl border flex justify-between items-center transition-all"
            >
              <span class="text-xs font-bold text-rose-400 font-mono" x-text="slot"></span>
              <template x-if="isSlotBooked(slot)">
                <div class="flex items-center gap-2">
                  <span class="text-xs text-white font-medium" x-text="getSlotAppointment(slot).clientName"></span>
                  <span class="text-[10px] px-2 py-0.5 bg-rose-500/20 text-rose-300 rounded border border-rose-500/30" x-text="getSlotAppointment(slot).serviceName"></span>
                </div>
              </template>
              <template x-if="!isSlotBooked(slot)">
                <span class="text-xs text-slate-500 flex items-center gap-1">
                  <i data-lucide="plus" class="w-3.5 h-3.5 text-rose-400"></i> Slot Livre - Agendar
                </span>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </main>

  <!-- MODAL DE CRIAÇÃO / EDIÇÃO DE AGENDAMENTO -->
  <div x-show="isModalOpen" x-cloak class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="zap" class="w-4 h-4 text-rose-400"></i>
          <span x-text="editingId ? 'Editar Ficha e Parâmetros' : 'Novo Agendamento'"></span>
        </h3>
        <button @click="isModalOpen = false" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form @submit.prevent="saveForm()" class="p-4 space-y-3 text-xs max-h-[80vh] overflow-y-auto">
        <div>
          <label class="block text-slate-400 mb-1">Nome da Cliente</label>
          <input type="text" x-model="form.clientName" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-rose-500" placeholder="Ex: Ana Silva" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">Categoria de Serviço</label>
            <select x-model="form.serviceCategory" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none">
              <option value="laser">⚡ Depilação a Laser</option>
              <option value="facial_catia">✨ Estética Facial (Cátia)</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Horário</label>
            <input type="text" x-model="form.time" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white font-mono outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Procedimento / Zona</label>
          <input type="text" x-model="form.serviceName" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none" placeholder="Ex: Sessão Corpo Todo ou Limpeza Profunda" />
        </div>

        <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
          <h4 class="font-bold text-rose-400">Anamnese Clínica</h4>
          <div class="flex justify-between items-center">
            <span class="text-slate-300">Fototipo Fitzpatrick:</span>
            <select x-model="form.fitzpatrick" class="bg-slate-900 border border-slate-700 rounded-lg p-1 text-purple-300 font-bold">
              <option value="I">Tipo I</option>
              <option value="II">Tipo II</option>
              <option value="III">Tipo III</option>
              <option value="IV">Tipo IV</option>
              <option value="V">Tipo V</option>
              <option value="VI">Tipo VI</option>
            </select>
          </div>
          <label class="flex items-center gap-2 text-slate-300 cursor-pointer pt-1">
            <input type="checkbox" x-model="form.usesAcids" class="rounded border-slate-700 text-rose-500" />
            Uso de Medicamentos / Ácidos Fotossensibilizantes
          </label>
        </div>

        <template x-if="form.serviceCategory === 'laser'">
          <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
            <h4 class="font-bold text-rose-400">Parâmetros do Equipamento Laser</h4>
            <div class="grid grid-cols-3 gap-2">
              <div>
                <span class="text-slate-400 block mb-1">Fluência (J/cm²)</span>
                <input type="number" x-model="form.fluence" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white font-mono" />
              </div>
              <div>
                <span class="text-slate-400 block mb-1">Pulso (ms)</span>
                <input type="number" x-model="form.pulse" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white font-mono" />
              </div>
              <div>
                <span class="text-slate-400 block mb-1">Disparos</span>
                <input type="number" x-model="form.shots" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white font-mono" />
              </div>
            </div>
          </div>
        </template>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" @click="isModalOpen = false" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold">Salvar Registos</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT ALPINE.JS E LÓGICA DO CRM -->
  <script>
    function crmApp() {
      return {
        devicePreview: 'mobile',
        viewMode: 'feed',
        selectedStoryId: null,
        isModalOpen: false,
        editingId: null,
        timeSlots: ['08:00', '09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
        
        form: {
          clientName: '',
          serviceCategory: 'laser',
          serviceName: 'Sessão Corpo Todo (Pacote Geral)',
          time: '09:00',
          fitzpatrick: 'III',
          usesAcids: false,
          price: 120,
          fluence: 18,
          pulse: 25,
          shots: 1200
        },

        appointments: [
          {
            id: '1',
            clientName: 'Ana Silva',
            serviceCategory: 'laser',
            serviceName: 'Sessão Corpo Todo (Pacote Geral)',
            price: 120,
            time: '09:00',
            status: 'alerta_clinico',
            laserParams: { fluenceJcm2: 18, pulseMs: 25, totalShots: 1200, spotSizeMm: 12 },
            anamnesis: { fitzpatrick: 'III', usesPhotosensitiveAcids: true }
          },
          {
            id: '2',
            clientName: 'Carla Santos',
            serviceCategory: 'facial_catia',
            serviceName: 'Limpeza de Pele Profunda + Hidratação (Cátia)',
            price: 45,
            time: '11:00',
            status: 'confirmada',
            anamnesis: { fitzpatrick: 'II', usesPhotosensitiveAcids: false }
          },
          {
            id: '3',
            clientName: 'Mariana Costa',
            serviceCategory: 'laser',
            serviceName: 'Depilação Laser - Zonas Médias/Grandes',
            price: 45,
            time: '14:00',
            status: 'pos_laser_pendente',
            laserParams: { fluenceJcm2: 20, pulseMs: 30, totalShots: 1600, spotSizeMm: 15 },
            anamnesis: { fitzpatrick: 'IV', usesPhotosensitiveAcids: false }
          }
        ],

        initApp() {
          this.$nextTick(() => { lucide.createIcons(); });
        },

        get filteredAppointments() {
          if (this.selectedStoryId) {
            return this.appointments.filter(a => a.id === this.selectedStoryId);
          }
          return this.appointments;
        },

        calculateRevenue() {
          return this.appointments.reduce((acc, curr) => acc + (curr.price || 45), 0);
        },

        countLaser() { return this.appointments.filter(a => a.serviceCategory === 'laser').length; },
        countFacial() { return this.appointments.filter(a => a.serviceCategory === 'facial_catia').length; },
        countAlerts() { return this.appointments.filter(a => a.anamnesis.usesPhotosensitiveAcids).length; },

        getStatusBorder(status) {
          if (status === 'alerta_clinico') return 'border-amber-500 bg-amber-500/10 text-amber-400 animate-pulse';
          if (status === 'concluido') return 'border-emerald-500 bg-emerald-500/10 text-emerald-400';
          if (status === 'pos_laser_pendente') return 'border-purple-500 bg-purple-500/10 text-purple-400';
          return 'border-blue-500 bg-blue-500/10 text-blue-400';
        },

        toggleStatus(app) {
          app.status = app.status === 'concluido' ? 'confirmada' : 'concluido';
        },

        isSlotBooked(slot) { return this.appointments.some(a => a.time === slot); },
        getSlotAppointment(slot) { return this.appointments.find(a => a.time === slot); },

        handleSlotClick(slot) {
          if (this.isSlotBooked(slot)) return;
          this.editingId = null;
          this.form.clientName = '';
          this.form.time = slot;
          this.isModalOpen = true;
          this.$nextTick(() => { lucide.createIcons(); });
        },

        openEditModal(app) {
          this.editingId = app.id;
          this.form.clientName = app.clientName;
          this.form.serviceCategory = app.serviceCategory;
          this.form.serviceName = app.serviceName;
          this.form.time = app.time;
          this.form.fitzpatrick = app.anamnesis.fitzpatrick;
          this.form.usesAcids = app.anamnesis.usesPhotosensitiveAcids;
          if (app.laserParams) {
            this.form.fluence = app.laserParams.fluenceJcm2;
            this.form.pulse = app.laserParams.pulseMs;
            this.form.shots = app.laserParams.totalShots;
          }
          this.isModalOpen = true;
          this.$nextTick(() => { lucide.createIcons(); });
        },

        saveForm() {
          const newApp = {
            id: this.editingId || String(Date.now()),
            clientName: this.form.clientName,
            serviceCategory: this.form.serviceCategory,
            serviceName: this.form.serviceName,
            price: this.form.serviceCategory === 'laser' ? 120 : 45,
            time: this.form.time,
            status: this.form.usesAcids ? 'alerta_clinico' : 'confirmada',
            laserParams: this.form.serviceCategory === 'laser' ? {
              fluenceJcm2: Number(this.form.fluence),
              pulseMs: Number(this.form.pulse),
              totalShots: Number(this.form.shots),
              spotSizeMm: 12
            } : null,
            anamnesis: {
              fitzpatrick: this.form.fitzpatrick,
              usesPhotosensitiveAcids: this.form.usesAcids
            }
          };

          if (this.editingId) {
            const index = this.appointments.findIndex(a => a.id === this.editingId);
            if (index !== -1) this.appointments[index] = newApp;
          } else {
            this.appointments.push(newApp);
          }

          this.isModalOpen = false;
          this.$nextTick(() => { lucide.createIcons(); });
        }
      }
    }
  </script>
</body>
</html>
