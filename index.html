<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operação GL - CRM & Estética Avançada</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen flex justify-center items-start bg-stone-100 font-sans text-stone-800 antialiased">

  <div id="auth-alert" class="hidden fixed top-6 left-1/2 -translate-x-1/2 z-50 max-w-md w-[92%] p-4 rounded-2xl bg-red-600 text-white font-bold shadow-2xl text-center text-xs tracking-wide"></div>

  <div id="main-container" class="w-full max-w-md bg-[#faf8f6] min-h-screen shadow-2xl relative flex flex-col pb-24 border-x border-stone-200">
    
    <!-- TELA DE LOGIN -->
    <section id="screen-login" class="p-6 flex flex-col justify-center min-h-screen bg-[#faf8f6]">
      <div class="text-center mb-10">
        <div class="w-20 h-20 bg-stone-800 text-white rounded-full flex items-center justify-center font-extrabold text-2xl mx-auto mb-4 shadow-xl border-4 border-stone-200">
          GL
        </div>
        <h1 class="text-2xl font-black text-stone-800 tracking-tight">Operação GL</h1>
        <p class="text-xs text-stone-500 font-medium mt-1">CRM & Gestão Estética Avançada</p>
      </div>

      <form id="form-login" class="space-y-4 bg-white p-6 rounded-3xl border border-stone-200/80 shadow-sm">
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1.5 uppercase tracking-wider">Nome de Utilizador</label>
          <input type="text" id="login-username" value="gabyzinha" required placeholder="Digite o seu utilizador" class="w-full p-3.5 bg-stone-50 border border-stone-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-stone-400 font-medium transition-all">
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1.5 uppercase tracking-wider">Palavra-passe</label>
          <input type="password" id="login-pass" value="Gaby150405" required class="w-full p-3.5 bg-stone-50 border border-stone-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-stone-400 font-medium transition-all">
        </div>

        <button type="submit" class="w-full py-4 bg-stone-800 text-white font-bold rounded-2xl text-sm shadow-lg hover:bg-stone-900 active:scale-[0.98] transition-all duration-150 mt-2">
          Entrar no CRM Operação GL
        </button>
      </form>
    </section>

    <!-- PAINEL PRINCIPAL -->
    <section id="screen-app" class="hidden flex-col flex-1">
      <header class="p-5 bg-white border-b border-stone-200/80 sticky top-0 z-30 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-stone-800 text-white rounded-xl flex items-center justify-center font-bold text-sm shadow-md">
            GL
          </div>
          <div>
            <h2 class="text-sm font-bold text-stone-800 leading-tight">Operação GL</h2>
            <p class="text-[11px] text-emerald-600 font-semibold flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Ligado ao Supabase
            </p>
          </div>
        </div>

        <button id="btn-logout" class="px-3 py-1.5 text-xs font-bold text-red-500 hover:bg-red-50 rounded-xl border border-red-200 transition">
          Sair
        </button>
      </header>

      <div id="content-agenda" class="p-4 space-y-4">
        <div class="flex items-center justify-between pt-1">
          <h3 class="text-sm font-extrabold text-stone-800">Atendimentos</h3>
          <button id="btn-abrir-modal" class="px-4 py-2 bg-stone-800 text-white font-bold text-xs rounded-xl shadow-md hover:bg-stone-900">
            + Novo Agendamento
          </button>
        </div>

        <div id="grid-agendamentos" class="space-y-3"></div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
