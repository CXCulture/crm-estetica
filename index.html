<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Operação GL - CRM & Estética Avançada</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    html, body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d6d3d1; border-radius: 10px; }
    .modal-open { opacity: 1 !important; pointer-events: auto !important; }
    .modal-content-open { transform: translateY(0) !important; }
    .toast-show { transform: translateY(0) !important; }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; transition: 0.2s; }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
  </style>
</head>
<body class="min-h-screen bg-stone-100 font-sans text-stone-800 antialiased flex justify-center selection:bg-emerald-200">

  <div id="system-alert" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] w-[90%] max-w-md p-4 rounded-xl shadow-2xl text-white text-xs font-bold text-center transition-all duration-300 translate-y-[-150%]"></div>
  
  <div id="toast-undo" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] bg-stone-900 text-white px-6 py-3.5 rounded-2xl shadow-2xl flex items-center justify-between w-[90%] max-w-sm transition-all duration-300 translate-y-[150%]">
    <span id="toast-undo-msg" class="text-xs font-medium">Ação realizada.</span>
    <button onclick="window.DB.desfazer()" class="text-emerald-400 hover:text-emerald-300 font-extrabold uppercase text-[10px] tracking-wider ml-4">Desfazer</button>
  </div>

  <main id="app-container" class="w-full max-w-md bg-[#faf8f6] min-h-screen shadow-2xl relative flex flex-col border-x border-stone-200 overflow-hidden">
    
    <!-- ECRÃ DE LOGIN -->
    <section id="screen-login" class="absolute inset-0 z-50 bg-[#faf8f6] flex flex-col justify-center p-8 transition-opacity duration-500">
      <div class="text-center mb-10 transform transition-transform hover:scale-105 duration-300">
        <div class="w-24 h-24 bg-gradient-to-br from-stone-800 to-stone-900 text-white rounded-[2rem] flex items-center justify-center font-black text-3xl mx-auto mb-6 shadow-2xl shadow-stone-900/20 border border-stone-700">GL</div>
        <h1 class="text-3xl font-black text-stone-800 tracking-tight">Operação GL</h1>
        <p class="text-xs text-stone-500 font-semibold mt-2 uppercase tracking-widest">Estética Avançada</p>
      </div>

      <!-- FORMULÁRIO COM ONSUBMIT DIRETO (À PROVA DE FALHAS) -->
      <form id="form-login" onsubmit="window.fazerLogin(event)" class="space-y-5 bg-white p-7 rounded-[2rem] border border-stone-100 shadow-xl shadow-stone-200/50 relative overflow-hidden">
        <div id="login-loader" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-10 hidden flex-col items-center justify-center">
          <div class="w-8 h-8 border-4 border-stone-200 border-t-stone-800 rounded-full animate-spin"></div>
          <p class="text-[10px] font-bold text-stone-600 mt-3 uppercase tracking-wider">A autenticar...</p>
        </div>

        <div>
          <label class="block text-[11px] font-extrabold text-stone-400 mb-2 uppercase tracking-wider">Utilizador</label>
          <input type="text" id="login-username" value="gabyzinha" required class="w-full p-4 bg-stone-50/50 border border-stone-200 rounded-2xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-stone-800 focus:border-transparent transition-all">
        </div>

        <div>
          <label class="block text-[11px] font-extrabold text-stone-400 mb-2 uppercase tracking-wider">Palavra-passe</label>
          <input type="password" id="login-pass" value="Gaby150405" required class="w-full p-4 bg-stone-50/50 border border-stone-200 rounded-2xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-stone-800 focus:border-transparent transition-all">
        </div>

        <button type="submit" class="w-full py-4 bg-stone-800 hover:bg-stone-900 text-white font-black rounded-2xl text-sm shadow-lg shadow-stone-800/30 active:scale-[0.98] transition-all mt-2">
          Aceder ao CRM
        </button>
      </form>
    </section>

    <!-- ECRÃ PRINCIPAL -->
    <section id="screen-app" class="hidden flex-col h-full opacity-0 transition-opacity duration-500">
      <header class="bg-white px-6 py-5 border-b border-stone-100 sticky top-0 z-30 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-4">
          <div class="w-11 h-11 bg-stone-800 text-white rounded-2xl flex items-center justify-center font-black text-sm shadow-md">GL</div>
          <div>
            <h2 class="text-sm font-black text-stone-800 tracking-tight">Operação GL</h2>
            <div class="flex items-center gap-1.5 mt-0.5">
              <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75
