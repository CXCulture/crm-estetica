<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agenda • Operação GL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 50: '#fdf8f6', 100: '#f2e8e5', 200: '#e5d3cd', 500: '#c89d93', 600: '#b58479', 700: '#96675d' } } } }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#e5e5e5] text-stone-800 font-sans antialiased min-h-screen flex justify-center">

  <!-- WRAPPER MOBILE-FIRST (Centralizado no Desktop, Tela Cheia no Mobile) -->
  <div class="w-full max-w-lg bg-[#faf8f6] min-h-screen shadow-2xl relative flex flex-col pb-20">

    <!-- ALERTAS GLOBAIS -->
    <div id="auth-alert" class="hidden fixed top-6 left-1/2 -translate-x-1/2 z-50 max-w-sm w-[90%] p-3 rounded-xl text-[11px] font-semibold shadow-xl transition-all duration-300 text-center"></div>

    <!-- ========================================== -->
    <!-- TELA DE LOGIN SEGURO                       -->
    <!-- ========================================== -->
    <div id="view-login" class="flex-1 flex flex-col justify-center items-center p-6 bg-white">
      <div class="w-full max-w-sm space-y-6">
        <div class="text-center space-y-2">
          <div class="w-14 h-14 bg-brand-500 rounded-full flex items-center justify-center text-white font-bold text-xl mx-auto shadow-md">GL</div>
          <h1 class="text-2xl font-bold text-stone-800 tracking-tight">Operação GL</h1>
          <p class="text-xs text-stone-400">Autenticação Segura</p>
        </div>
        <form onsubmit="Auth.handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-stone-600 mb-1">E-mail</label>
            <input type="email" id="login-email" required autocomplete="username" class="w-full p-3 text-sm rounded-xl border border-brand-100 bg-brand-50/30 focus:outline-none focus:border-brand-500 transition" placeholder="catia@operacaogl.pt" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-600 mb-1">Palavra-passe</label>
            <input type="password" id="login-password" required autocomplete="current-password" class="w-full p-3 text-sm rounded-xl border border-brand-100 bg-brand-50/30 focus:outline-none focus:border-brand-500 transition" placeholder="••••••••" />
          </div>
          <button type="submit" id="btn-login" class="w-full py-3.5 rounded-xl bg-brand-500 text-white font-bold hover:bg-brand-600 transition shadow-md text-sm">
            Entrar na Agenda
          </button>
        </form>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- ÁREA PROTEGIDA: AGENDA DA APLICAÇÃO        -->
    <!-- ========================================== -->
    <div id="view-app" class="hidden flex-1 flex flex-col h-full relative">
      
      <!-- TOPBAR FIXA -->
      <header class="bg-white/90 backdrop-blur-md sticky top-0 z-30 px-5 py-4 border-b border-brand-100 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 bg-brand-500 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-sm">GL</div>
          <div>
            <span class="block font-semibold text-sm tracking-tight text-stone-800">Agenda • Benfica</span>
            <span id="sync-status" class="block text-[9px] font-medium text-emerald-500">Sincronizado</span>
          </div>
        </div>
        <button onclick="Auth.handleLogout()" class="text-[10px] text-stone-500 font-semibold px-3 py-1.5 bg-stone-100 hover:bg-stone-200 rounded-lg transition">Sair</button>
      </header>

      <!-- STORIES: ATENDIMENTOS DO DIA -->
      <section class="bg-white py-4 border-b border-brand-100 shrink-0">
        <p class="px-5 text-[10px] font-bold uppercase text-stone-400 tracking-wider mb-3">Atendimentos de Hoje</p>
        <div id="stories-container" class="flex space-x-5 px-5 overflow-x-auto no-scrollbar pb-1">
          <!-- JS Injecta Stories Aqui -->
        </div>
      </section>

      <!-- FEED CRONOLÓGICO -->
      <main class="flex-1 overflow-y-auto p-5 space-y-4" id="feed-container">
        <!-- JS Injecta Feed Aqui -->
      </main>

      <!-- BOTTOM TAB BAR ESTILO APP -->
      <nav class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-brand-100 px-6 py-3 flex justify-around items-center z-30 pb-safe">
        <button onclick="App.loadData()" class="flex flex-col items-center text-brand-600 transition transform active:scale-95">
          <span class="text-xl">🏠</span>
          <span class="text-[9px] font-bold mt-1">Agenda</span>
        </button>
        <button onclick="UI.openModal()" class="flex flex-col items-center text-stone-400 hover:text-brand-500 transition transform active:scale-95">
          <div class="bg-brand-500 text-white rounded-full w-10 h-10 flex items-center justify-center -mt-5 shadow-lg border-4 border-[#faf8f6]">
            <span class="text-xl leading-none">+</span>
          </div>
          <span class="text-[9px] font-bold mt-1">Novo</span>
        </button>
        <button class="flex flex-col items-center text-stone-400 hover:text-brand-500 transition transform active:scale-95">
          <span class="text-xl">👤</span>
          <span class="text-[9px] font-bold mt-1">Clientes</span>
        </button>
      </nav>
    </div>

  </div> <!-- FIM WRAPPER -->

  <!-- ========================================== -->
  <!-- MODAL FLEXÍVEL (CRIAR E EDITAR)              -->
  <!-- ========================================== -->
  <div id="modal-agendamento" class="hidden fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center sm:p-4">
    <!-- Animação slide-up no mobile -->
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-5 border border-brand-100 text-xs max-h-[90vh] overflow-y-auto transform transition-transform animate-slide-up">
      <div class="flex justify-between items-center border-b border-brand-50 pb-3">
        <h3 id="modal-title" class="font-bold text-base text-stone-800">Novo Agendamento</h3>
        <button onclick="UI.closeModal()" class="text-stone-400 hover:text-stone-700 text-xl font-bold bg-stone-100 w-8 h-8 rounded-full flex items-center justify-center transition">&times;</button>
      </div>

      <form id="form-agendamento" onsubmit="Controllers.saveData(event)" class="space-y-4">
        <!-- Campo oculto para saber se é Edição ou Criação -->
        <input type="hidden" id="edit-id" value="" />

        <div>
          <label class="block font-semibold text-stone-600 mb-1.5">Nome da Cliente *</label>
          <input type="text" id="input-nome" required class="w-full p-3 text-sm rounded-xl border border-brand-100 bg-brand-50/30 focus:outline-none focus:border-brand-500 transition" placeholder="Ex: Catlene" />
        </div>
        <div>
          <label class="block font-semibold text-stone-600 mb-1.5">WhatsApp / Telefone *</label>
          <input type="text" id="input-telefone" required class="w-full p-3 text-sm rounded-xl border border-brand-100 bg-brand-50/30 focus:outline-none focus:border-brand-500 transition" placeholder="Ex: 920465838" />
        </div>
        <div>
          <label class="block font-semibold text-stone-600 mb-1.5">Data e Hora do Atendimento *</label>
          <input type="datetime-local" id="input-data" required class="w-full p-3 text-sm rounded-xl border border-brand-100 bg-brand-50/30 focus:outline-none focus:border-brand-500 transition" />
        </div>
        
        <div class="border-t border-brand-50 pt-4 mt-2">
          <p class="text-[10px] font-bold text-brand-600 uppercase tracking-wider mb-3">Detalhes do Laser</p>
          <div>
            <label class="block font-semibold text-stone-600 mb-1.5">Zonas a Tratar *</label>
            <input type="text" id="input-zonas" required class="w-full p-3 text-sm rounded-xl border border-brand-100 bg-brand-50/30 focus:outline-none focus:border-brand-500 transition" placeholder="Ex: Virilha, Axilas e Perna" />
          </div>
          <div class="grid grid-cols-2 gap-3 mt-4">
            <div>
              <label class="block font-semibold text-stone-600 mb-1.5">Fluência (J/cm²)</label>
              <input type="number" step="0.1" id="input-fluencia" class="w-full p-3 text-sm rounded-xl border border-brand-100 bg-brand-50/30 focus:outline-none focus:border-brand-500 transition" placeholder="Ex: 18" />
            </div>
            <div>
              <label class="block font-semibold text-stone-600 mb-1.5">Disparos Totais</label>
              <input type="number" id="input-disparos" class="w-full p-3 text-sm rounded-xl border border-brand-100 bg-brand-50/30 focus:outline-none focus:border-brand-500 transition" placeholder="Ex: 450" />
            </div>
          </div>
        </div>

        <div class="flex space-x-3 pt-4">
          <button type="button" onclick="UI.closeModal()" class="w-1/3 py-3.5 rounded-xl font-bold text-stone-600 bg-stone-100 hover:bg-stone-200 transition text-sm">Cancelar</button>
          <button type="submit" id="btn-submit" class="w-2/3 py-3.5 rounded-xl bg-brand-500 text-white font-bold hover:bg-brand-600 transition shadow-md text-sm">Salvar Ficha</button>
        </div>
      </form>
    </div>
  </div>

  <style>
    @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>

  <!-- ========================================== -->
  <!-- LÓGICA DE BACKEND E INTERAÇÃO (JS)         -->
  <!-- ========================================== -->
  <script>
    // 1. CONFIGURAÇÃO SUPABASE
    const SUPABASE_URL = 'https://SEU-PROJETO.supabase.co';
    const SUPABASE_ANON_KEY = 'SUA-CHAVE-ANONIMA-AQUI';
    
    let db = null;
    if (SUPABASE_URL !== 'https://SEU-PROJETO.supabase.co') {
      db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // ESTADO DA APLICAÇÃO (Single Source of Truth)
    const State = { agendamentos: [] };

    const Auth = {
      showAlert(msg, type = 'error') {
        const box = document.getElementById('auth-alert');
        box.className = `fixed top-6 left-1/2 -translate-x-1/2 z-50 max-w-sm w-[90%] p-3 rounded-xl text-[11px] font-bold shadow-xl transition-all duration-300 text-center ${type === 'error' ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}`;
        box.innerText = msg;
        box.classList.remove('hidden');
        setTimeout(() => box.classList.add('hidden'), 3500);
      },
      async handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        
        btn.innerText = "A autenticar...";
        try {
          if (!db) { Auth.showAlert("Aviso: Supabase não conectado. Modo demonstração.", "success"); this.loginSuccess(); return; }
          const { error } = await db.auth.signInWithPassword({ email, password });
          if (error) throw error;
          this.loginSuccess();
        } catch (err) {
          Auth.showAlert("Erro: Verifique credenciais.", "error");
          btn.innerText = "Entrar na Agenda";
        }
      },
      loginSuccess() {
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-app').classList.remove('hidden');
        App.init();
      },
      async handleLogout() {
        if (db) await db.auth.signOut();
        document.getElementById('view-login').classList.remove('hidden');
        document.getElementById('view-app').classList.add('hidden');
      },
      async checkSession() {
        if (db) { const { data: { session } } = await db.auth.getSession(); if (session) this.loginSuccess(); }
      }
    };

    const UI = {
      openModal(isEdit = false) {
        document.getElementById('modal-title').innerText = isEdit ? "Editar Ficha" : "Novo Agendamento";
        document.getElementById('btn-submit').innerText = isEdit ? "Atualizar Ficha" : "Salvar Ficha";
        document.getElementById('modal-agendamento').classList.remove('hidden');
      },
      closeModal() {
        document.getElementById('form-agendamento').reset();
        document.getElementById('edit-id').value = "";
        document.getElementById('modal-agendamento').classList.add('hidden');
      },
      setSyncStatus(status) {
        const el = document.getElementById('sync-status');
        el.innerText = status;
        el.className = `block text-[9px] font-bold ${status === 'Sincronizado' ? 'text-emerald-500' : 'text-amber-500 animate-pulse'}`;
      },
      renderEmptyState() {
        document.getElementById('stories-container').innerHTML = '';
        document.getElementById('feed-container').innerHTML = `
          <div class="flex flex-col items-center justify-center h-64 text-center space-y-3 opacity-60">
            <div class="text-4xl">📅</div>
            <h3 class="font-bold text-stone-700">A agenda está limpa!</h3>
            <p class="text-xs text-stone-500 max-w-xs">A base de dados está vazia. Clique no botão de Novo Agendamento (+) para começar a registar.</p>
          </div>
        `;
      },
      renderData(data) {
        if (!data || data.length === 0) return this.renderEmptyState();

        // Renderizar Stories (Apenas Iniciais)
        document.getElementById('stories-container').innerHTML = data.map(i => `
          <div class="flex flex-col items-center space-y-1.5 min-w-[56px] cursor-pointer hover:opacity-80 transition">
            <div class="w-14 h-14 rounded-full p-[3px] border-[2px] border-emerald-500 flex items-center justify-center bg-transparent">
              <div class="w-full h-full bg-brand-100 rounded-full flex items-center justify-center text-brand-700 font-bold text-sm">${i.nome_temporario ? i.nome_temporario.substring(0,2).toUpperCase() : 'GL'}</div>
            </div>
            <span class="text-[10px] font-bold text-stone-700 truncate w-14 text-center">${(i.nome_temporario || '').split(' ')[0]}</span>
          </div>
        `).join('');

        // Renderizar Feed
        document.getElementById('feed-container').innerHTML = data.map(i => {
          const dateObj = new Date(i.data_hora);
          const time = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const day = dateObj.toLocaleDateString([], { day: '2-digit', month: 'short' });
          
          return `
          <article class="bg-white rounded-3xl overflow-hidden shadow-sm border border-stone-100 transition transform hover:shadow-md">
            <div class="p-4 flex justify-between items-start bg-white">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-brand-500 text-white rounded-full flex items-center justify-center font-bold text-sm shadow-sm">${i.nome_temporario ? i.nome_temporario.substring(0,2).toUpperCase() : 'GL'}</div>
                <div>
                  <h3 class="text-sm font-bold text-stone-800 tracking-tight">${i.nome_temporario}</h3>
                  <p class="text-[10px] font-semibold text-brand-600 bg-brand-50 inline-block px-2 py-0.5 rounded-md mt-0.5">📅 ${day} às ${time}</p>
                </div>
              </div>
              <button onclick="Controllers.prepareEdit('${i.id}')" class="text-stone-400 hover:text-brand-600 bg-stone-50 hover:bg-brand-50 w-8 h-8 rounded-full flex items-center justify-center transition">
                ✏️
              </button>
            </div>
            <div class="px-4 pb-4">
              <div class="bg-stone-50 rounded-2xl p-3 space-y-2 border border-stone-100">
                <p class="text-xs text-stone-600">Zonas: <strong class="text-stone-800">${i.zonas}</strong></p>
                <div class="flex justify-between items-center font-mono text-[10px] pt-2 border-t border-stone-200">
                  <span class="bg-white px-2 py-1 rounded shadow-sm border border-stone-100">⚡ ${i.fluencia || '--'} J/cm²</span>
                  <span class="bg-white px-2 py-1 rounded shadow-sm border border-stone-100">🎯 ${i.disparos || '--'} Disp.</span>
                </div>
              </div>
            </div>
          </article>
        `}).join('');
      }
    };

    const Controllers = {
      // PREPARAR EDIÇÃO: Abre o modal preenchido
      prepareEdit(id) {
        const item = State.agendamentos.find(a => a.id === id);
        if (!item) return;

        document.getElementById('edit-id').value = item.id;
        document.getElementById('input-nome').value = item.nome_temporario;
        document.getElementById('input-telefone').value = item.telefone_temporario;
        
        // Formatar data para o input datetime-local
        const dateObj = new Date(item.data_hora);
        dateObj.setMinutes(dateObj.getMinutes() - dateObj.getTimezoneOffset());
        document.getElementById('input-data').value = dateObj.toISOString().slice(0,16);
        
        document.getElementById('input-zonas').value = item.zonas;
        document.getElementById('input-fluencia').value = item.fluencia;
        document.getElementById('input-disparos').value = item.disparos;
        
        UI.openModal(true);
      },

      // SALVAR OU ATUALIZAR (CRUD)
      async saveData(e) {
        e.preventDefault();
        UI.setSyncStatus("Sincronizando...");
        
        const id = document.getElementById('edit-id').value;
        const payload = {
          nome_temporario: document.getElementById('input-nome').value.trim(),
          telefone_temporario: document.getElementById('input-telefone').value.trim(),
          data_hora: new Date(document.getElementById('input-data').value).toISOString(),
          zonas: document.getElementById('input-zonas').value.trim(),
          fluencia: parseFloat(document.getElementById('input-fluencia').value) || 0,
          disparos: parseInt(document.getElementById('input-disparos').value) || 0
        };

        if (db) {
          try {
            if (id) {
              // UPDATE
              const { error } = await db.from('agendamentos').update(payload).eq('id', id);
              if (error) throw error;
              Auth.showAlert("Ficha atualizada com sucesso!", "success");
            } else {
              // INSERT
              const { error } = await db.from('agendamentos').insert([payload]);
              if (error) throw error;
              Auth.showAlert("Agendamento criado com sucesso!", "success");
            }
          } catch (error) {
            Auth.showAlert("Erro de base de dados: " + error.message, "error");
            UI.setSyncStatus("Erro de Sincronização");
            return;
          }
        } else {
          // Lógica de UI se não houver DB (Apenas Teste Visual)
          if(id) { const idx = State.agendamentos.findIndex(a=>a.id===id); State.agendamentos[idx] = {...State.agendamentos[idx], ...payload}; } 
          else { State.agendamentos.unshift({id: Date.now().toString(), ...payload}); }
        }

        UI.closeModal();
        await App.loadData();
      }
    };

    const App = {
      async init() { await this.loadData(); },
      async loadData() {
        UI.setSyncStatus("Carregando...");
        if (db) {
          const { data, error } = await db.from('agendamentos').select('*').order('data_hora', { ascending: true });
          if (!error && data) { State.agendamentos = data; }
        }
        UI.renderData(State.agendamentos);
        UI.setSyncStatus("Sincronizado");
      }
    };

    document.addEventListener('DOMContentLoaded', () => Auth.checkSession());
  </script>
</body>
</html>
